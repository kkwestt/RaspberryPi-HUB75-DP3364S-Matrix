; LED video player firmware: Waveshare ESP32-S3-RGB-Matrix + 3 DP3364S HUB75 panels
; Build & flash:  pio run -e waveshare_matrix -t upload
; Logs:           pio device monitor

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  olikraus/U8g2_for_Adafruit_GFX@^1.8.0
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=2

; Waveshare ESP32-S3-RGB-Matrix: ESP32-S3-WROOM-2-N32R16V
; (32 MB octal flash, 16 MB octal PSRAM, 1.8 V).
; Only the first 16 MB of flash are used for now (default_16MB: 2 x 6.25 MB app
; slots for OTA); the videos live on the TF card.
[env:waveshare_matrix]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = opi_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial log over USB: UART0 pins 43/44 are I2S SCLK / SD CMD

; Same board, firmware upload over Wi-Fi via the device's /update page (HTTP).
; Password = OTA_PASSWORD from include/secrets.h, passed through the environment:
;   OTA_PASSWORD=... pio run -e waveshare_matrix_ota -t upload
; Use --upload-port <IP> if led-player.local does not resolve.
[env:waveshare_matrix_ota]
extends = env:waveshare_matrix
upload_protocol = custom
upload_port = led-player.local
upload_command = curl --fail -sS -m 180 -u admin:${sysenv.OTA_PASSWORD} -F "fw=@$SOURCE" http://$UPLOAD_PORT/update


