; Stand display firmware (ESP32-S3 + DP3364S HUB75 panels)
; Build & flash:  pio run -e matrixportal_s3 -t upload
; Logs:           pio device monitor

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  olikraus/U8g2_for_Adafruit_GFX@^1.8.0
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=2

; Adafruit MatrixPortal S3 (ESP32-S3, 8 MB flash, 2 MB PSRAM, HUB75 connector)
[env:matrixportal_s3]
board = adafruit_matrixportal_esp32s3

; Generic ESP32-S3 DevKitC-1 N16R8 (16 MB flash, 8 MB octal PSRAM).
; Wire HUB75 through a 3.3 V -> 5 V buffer (74HCT245) and set the pins in config.h.
[env:esp32s3_devkitc_n16r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv   ; 2 x 6.25 MB app slots for OTA
build_flags =
  ${env.build_flags}
  -DBOARD_DEVKIT_N16R8
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial log over the native USB port

; Same board, firmware upload over Wi-Fi via the device's /update page (HTTP).
; Works across subnets (the computer connects to the board). Password = OTA_PASSWORD
; from include/secrets.h, passed through the environment:
;   OTA_PASSWORD=... pio run -e esp32s3_devkitc_n16r8_ota -t upload
; Use --upload-port <IP> if stand-display.local does not resolve.
[env:esp32s3_devkitc_n16r8_ota]
extends = env:esp32s3_devkitc_n16r8
upload_protocol = custom
upload_port = stand-display.local
upload_command = curl --fail -sS -m 180 -u admin:${sysenv.OTA_PASSWORD} -F "fw=@$SOURCE" http://$UPLOAD_PORT/update

; Classic ArduinoOTA (espota). The board connects back to the computer, so it
; only works when both are on the same network segment.
[env:esp32s3_devkitc_n16r8_arduinoota]
extends = env:esp32s3_devkitc_n16r8
upload_protocol = espota
upload_port = stand-display.local
upload_flags =
  --auth=${sysenv.OTA_PASSWORD}
